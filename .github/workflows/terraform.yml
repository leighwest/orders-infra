name: Terraform

on:
  push:
    branches:
      - main

concurrency:
  group: terraform
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: 1.15.8

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::519852452516:role/orders-infra-terraform
          aws-region: ap-southeast-4

      - name: Package Lambda functions
        run: |
          pip install "botocore[crt]" -t ec2_stop_package/
          cp scripts/ec2_stop.py ec2_stop_package/
          cd ec2_stop_package && zip -r ../ec2_stop.zip . && cd ..

          pip install "botocore[crt]" -t ec2_start_package/
          cp scripts/ec2_start.py ec2_start_package/
          cd ec2_start_package && zip -r ../ec2_start.zip . && cd ..

          zip -j dispatch_lambda.zip dispatch_lambda/index.mjs
          aws s3 cp ec2_stop.zip s3://orders-lambda-artifacts/ec2_stop/${{ github.sha }}.zip
          aws s3 cp ec2_start.zip s3://orders-lambda-artifacts/ec2_start/${{ github.sha }}.zip
          aws s3 cp dispatch_lambda.zip s3://orders-lambda-artifacts/dispatch/${{ github.sha }}.zip

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan -var="GIT_SHA=${{ github.sha }}"

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 1

  apply:
    runs-on: ubuntu-latest
    needs: plan
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::519852452516:role/orders-infra-terraform
          aws-region: ap-southeast-4

      - name: Terraform init
        run: terraform init

      - uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: Terraform apply
        run: terraform apply -input=false tfplan
